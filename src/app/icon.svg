<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="16" fill="#E6DAF8"/>
  <!-- back hair, falling past the face -->
  <path d="M10 36C10 17 20 8 32 8s22 9 22 28c0 9-2 16-6 20-3-4-3-10-3-14H19c0 4 0 10-3 14-4-4-6-11-6-20z" fill="#5B3F8F"/>
  <!-- face -->
  <ellipse cx="32" cy="37" rx="15" ry="16" fill="#FFE2CF"/>
  <!-- side-swept fringe -->
  <path d="M16 33C16 20 24 13 33 13c8 0 14 6 15 15-8-1-14-5-17-10-2 6-8 12-15 15z" fill="#7B5BC7"/>
  <path d="M33 13c4 0 7 1 10 4-4 0-8 0-11 3z" fill="#8F72D8"/>
  <!-- little curl -->
  <path d="M12 44c-3 1-3 6 1 6 3 0 4-4 1-5" fill="none" stroke="#5B3F8F" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M52 44c3 1 3 6-1 6-3 0-4-4-1-5" fill="none" stroke="#5B3F8F" stroke-width="2.4" stroke-linecap="round"/>
  <!-- happy closed eyes -->
  <path d="M24 38q2.5-3 5 0M35 38q2.5-3 5 0" fill="none" stroke="#4A3A73" stroke-width="2" stroke-linecap="round"/>
  <!-- cheeks + smile -->
  <circle cx="22.5" cy="43" r="2.6" fill="#FFB3C7"/>
  <circle cx="41.5" cy="43" r="2.6" fill="#FFB3C7"/>
  <path d="M28.5 44q3.5 3.5 7 0" fill="none" stroke="#4A3A73" stroke-width="2" stroke-linecap="round"/>
  <!-- heart hair clip -->
  <path d="M44 14.5c0-2 3-2.5 3.5-.3.5-2.2 3.5-1.7 3.5.3 0 2-3.5 4-3.5 4s-3.5-2-3.5-4z" fill="#FF8FB1"/>
